name: Android-build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-android:
    name: 🤖 Android Build
    runs-on: ubuntu-latest
    permissions:
      # Nur für den Veröffentlichungsschritt unten; beim normalen Bauen
      # wird nichts geschrieben.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter pub get

      # Der Signaturschlüssel kommt aus Secrets und darf fehlen: Ohne ihn
      # baut Gradle mit dem Debug-Schlüssel weiter. Ein Fork oder ein frisch
      # geklontes Repository soll bauen können, ohne dass jemand Geheimnisse
      # hinterlegt hat.
      - name: Signaturschlüssel einrichten (falls hinterlegt)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Die Prüfung steht in der Shell und nicht in einem if: Der
        # secrets-Kontext ist auf Schritt-Ebene nicht verfügbar.
        run: |
          set -eu
          if [ -z "${KEYSTORE:-}" ]; then
            echo "Kein Schlüssel hinterlegt — es wird mit dem Debug-Schlüssel gebaut."
            exit 0
          fi
          echo "$KEYSTORE" | base64 --decode > android/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "Mit eigenem Schlüssel signieren."

      - name: Analyse
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taeglich-klueger-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: taeglich-klueger-aab
          path: build/app/outputs/bundle/release/app-release.aab

      # Der Schlüssel hat auf dem Läufer nichts verloren, sobald gebaut ist.
      - name: Signaturschlüssel entfernen
        if: always()
        run: rm -f android/upload.jks android/key.properties

      # Nur bei einem von Hand angestoßenen Lauf: eine Version mit der
      # vollständigen APK. Sie ist 56 MB und passt durch keinen Chat; ein
      # Actions-Artefakt verlangt eine Anmeldung und läuft nach Wochen ab —
      # eine Version nicht. Die Nummer kommt aus pubspec.yaml, damit sie
      # nicht zweimal gepflegt werden muss.
      - name: Version veröffentlichen
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          VERSION="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          TAG="v${VERSION}"
          cp build/app/outputs/flutter-apk/app-release.apk \
             "Taeglich-Klueger-${TAG}.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
             "Taeglich-Klueger-${TAG}.aab"
          NOTIZ="Vollständige APK für alle Architekturen (arm64, armeabi-v7a, x86_64). Auf dem Telefon herunterladen und öffnen; Android fragt einmal nach der Erlaubnis, Apps aus dieser Quelle zu installieren."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "Taeglich-Klueger-${TAG}.apk" \
              "Taeglich-Klueger-${TAG}.aab" --clobber
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Täglich Klüger $TAG" \
              --notes "$NOTIZ" \
              "Taeglich-Klueger-${TAG}.apk" \
              "Taeglich-Klueger-${TAG}.aab"
          fi

